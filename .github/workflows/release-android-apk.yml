name: release-android-apk

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified APK to the rolling Android release
        type: boolean
        default: false
      apk_build_id:
        description: EAS build ID of the accepted APK (required to publish)
        type: string
      apk_sha256:
        description: File SHA-256 recorded during installation acceptance (required to publish)
        type: string
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
      apk_build_id:
        description: EAS build ID of the accepted APK (required to publish)
        type: string
      apk_sha256:
        description: File SHA-256 recorded during installation acceptance (required to publish)
        type: string

permissions:
  contents: read

concurrency:
  # APK and AAB builds increment the same remote Android version counter.
  group: release-android
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and publish the Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version_code: ${{ steps.build.outputs.version_code }}
      build_id: ${{ steps.build.outputs.build_id }}
      sha256: ${{ steps.build.outputs.sha256 }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require Expo automation token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret with access to the @runtars/runtars Expo project." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        run: pnpm --filter @rakazo/mobile check

      # EAS signs with the project's managed Android keystore and bakes in the production update
      # channel, so installed APKs receive the same OTA updates as store builds.
      - name: Build or retrieve the accepted EAS APK
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          ACCEPTED_ID: ${{ inputs.apk_build_id }}
          ACCEPTED_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/build.json"
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$ACCEPTED_ID" =~ ^[0-9a-fA-F-]{36}$ && "$ACCEPTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "Publishing requires the accepted EAS build ID and APK SHA-256." >&2
              exit 1
            }
            pnpm exec eas build:view "$ACCEPTED_ID" --json > "$metadata"
            jq -e --arg id "$ACCEPTED_ID" '.id == $id' "$metadata" > /dev/null
          else
            pnpm exec eas build --platform android --profile android-apk --non-interactive --wait --json | jq '.[0]' > "$metadata"
          fi
          jq -e --arg project "$(jq -r '.expo.extra.eas.projectId' app.json)" '
            .app.id == $project and .status == "FINISHED" and .platform == "ANDROID" and
            .buildProfile == "android-apk" and .updateChannel.name == "production" and
            .appIdentifier == "com.runtars.app"
          ' "$metadata" > /dev/null
          url="$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl' "$metadata")"
          version="$(jq -er '.appVersion' "$metadata")"
          version_code="$(jq -er '.appBuildVersion' "$metadata")"
          if [[ -z "$url" || "$url" == "null" || "$url" != https://* ]]; then
            echo "EAS did not return an APK download URL." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/runtars.apk" "$url"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$RUNNER_TEMP/runtars.apk"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          if [[ "$PUBLISH" == "true" && "$sha256" != "${ACCEPTED_SHA256,,}" ]]; then
            echo "The downloaded APK differs from the accepted file." >&2
            exit 1
          fi
          echo "EAS build $(jq -r '.id' "$metadata"), versionCode $version_code, APK SHA-256 $sha256" >> "$GITHUB_STEP_SUMMARY"
          "$build_tools/apksigner" verify --print-certs --print-certs-pem "$apk" > "$RUNNER_TEMP/apk-cert.txt"
          openssl x509 -in "$RUNNER_TEMP/apk-cert.txt" -outform DER -out "$RUNNER_TEMP/signer.der"
          echo "6269be0c2195e6c1571eaedfde7fe6262162a63662e89df57e66c7839fa4915b  $RUNNER_TEMP/signer.der" | sha256sum --check
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.runtars.app' versionCode='$version_code' versionName='$version'" "$RUNNER_TEMP/apk-badging.txt"
          source_commit="$(jq -er '.gitCommitHash | select(test("^[0-9a-f]{40}$"))' "$metadata")"
          echo "build_id=$(jq -er '.id' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtars-android-${{ steps.build.outputs.version_code }}
          path: ${{ runner.temp }}/runtars.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # One rolling release keeps a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/android/runtars.apk
      # It never becomes GitHub's "latest" release, which the desktop updater reads. An existing
      # release is updated in place: the new APK is uploaded under a temporary name before the old
      # one is renamed. Keep the old asset available for rollback until the new name is live.
      - name: Publish rolling release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          ACCEPTED_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT" --jq .sha)" = "$SOURCE_COMMIT"
          title="RunTars for Android $VERSION ($VERSION_CODE)"
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            if ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
              cat "$RUNNER_TEMP/view.err" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/runtars.apk" \
              --target "$SOURCE_COMMIT" \
              --title "$title" \
              --notes "Install runtars.apk on your Android phone. It updates itself over the air." \
              --latest=false
            exit 0
          fi

          staged="runtars-$VERSION_CODE.apk"
          cp "$RUNNER_TEMP/runtars.apk" "$RUNNER_TEMP/$staged"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$staged" --clobber
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets')"
          staged_id="$(jq -r --arg name "$staged" '.[] | select(.name == $name) | .id' <<< "$assets")"
          old_id="$(jq -r '.[] | select(.name == "runtars.apk") | .id' <<< "$assets")"
          staged_digest="$(jq -r --arg name "$staged" '.[] | select(.name == $name) | .digest' <<< "$assets")"
          if [[ "$staged_digest" != "sha256:${ACCEPTED_SHA256,,}" ]]; then
            echo "GitHub did not confirm the accepted SHA-256 for the staged APK." >&2
            exit 1
          fi
          if [[ -z "$staged_id" ]]; then
            echo "The uploaded $staged is missing from the release; leaving the previous APK in place." >&2
            exit 1
          fi
          if [[ -n "$old_id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name="previous-$old_id.apk" > /dev/null
          fi
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_id" -f name=runtars.apk > /dev/null; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              if [[ -n "$old_id" ]]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name=runtars.apk > /dev/null
              fi
              echo "Could not rename $staged to runtars.apk." >&2
              exit 1
            fi
            sleep 5
          done
          if [[ -n "$old_id" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$SOURCE_COMMIT" -F force=true > /dev/null
          gh release edit "$RELEASE_TAG" --title "$title" --latest=false

      - name: Verify the final rolling APK
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPTED_SHA256: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern runtars.apk --output "$RUNNER_TEMP/published.apk"
          echo "${ACCEPTED_SHA256,,}  $RUNNER_TEMP/published.apk" | sha256sum --check

  acceptance:
    name: Install and cold-launch the candidate on Android 35
    needs: release
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtars-android-${{ needs.release.outputs.version_code }}
          path: candidate
      - name: Check the candidate and fetch the current public APK
        env:
          APK_SHA256: ${{ needs.release.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$APK_SHA256  candidate/runtars.apk" | sha256sum --check
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > tags
          if grep -Fxq android tags; then
            gh release download android -R "$GITHUB_REPOSITORY" --pattern runtars.apk --dir previous
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666",OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            if [ -f previous/runtars.apk ]; then adb install previous/runtars.apk; fi
            adb install -r candidate/runtars.apk
            adb shell am start -S -W -n com.runtars.app/.MainActivity
            timeout 90 bash -c 'until adb shell uiautomator dump /sdcard/window.xml >/dev/null && adb shell cat /sdcard/window.xml | grep -E "(Welcome to|Sign in to|Sign up for) RunTars" >/dev/null; do sleep 2; done'
      - name: Record the accepted EAS build and APK checksum
        env:
          BUILD_ID: ${{ needs.release.outputs.build_id }}
          APK_SHA256: ${{ needs.release.outputs.sha256 }}
        run: echo "Accepted EAS build $BUILD_ID with SHA-256 $APK_SHA256" | tee -a "$GITHUB_STEP_SUMMARY"

name: Release RunTars

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-server-stable
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Validate stable tag, release notes and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | node scripts/release/desktop-release.mjs check-newer "$GITHUB_REF_NAME"

  images:
    needs: validate
    uses: ./.github/workflows/publish-server-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  windows:
    needs: validate
    uses: ./.github/workflows/build-windows-client.yml
    secrets:
      WINDOWS_RELEASE_PFX: ${{ secrets.WINDOWS_RELEASE_PFX }}
      WINDOWS_RELEASE_PFX_PASSWORD: ${{ secrets.WINDOWS_RELEASE_PFX_PASSWORD }}
    with:
      version: ${{ needs.validate.outputs.version }}

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm --filter @rakazo/desktop... --filter @rakazo/web... --filter rakazo install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build renderer and desktop app
        shell: bash
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
          RAKAZO_DESKTOP_RELEASE: "1"
          RUNTARS_MANUAL_UPDATES: "1"
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/web build
          pnpm --filter @rakazo/desktop build
          node apps/desktop/scripts/release-feed.mjs apps/desktop/package.json
          cd apps/desktop
          npm pkg set productName=RunTars author.name=RunTars version="$RELEASE_VERSION" \
            build.appId=com.runtars.desktop build.extraMetadata.name=runtars \
            build.linux.executableName=runtars 'build.linux.artifactName=RunTars-${version}-x64.AppImage'
          pnpm exec electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: apps/desktop/out/RunTars-${{ env.RELEASE_VERSION }}-x64.AppImage
          if-no-files-found: error

  release:
    needs: [validate, images, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify public release tags match the published commit
        run: |
          set -euo pipefail
          for name in app computer updater; do
            image="ghcr.io/$GITHUB_REPOSITORY/$name"
            digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$digest" = "$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: clients
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: clients
      - name: Verify client assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer="RunTars-Setup-$version.exe"
          appimage="RunTars-$version-x64.AppImage"
          cd clients
          test -s "$installer"
          test -s "$appimage"
          sha256sum "$installer" "$appimage" > SHA256SUMS
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" "$installer" "$appimage" SHA256SUMS --latest --verify-tag \
            --title "RunTars $GITHUB_REF_NAME" --notes-file "../docs/releases/$GITHUB_REF_NAME.md"

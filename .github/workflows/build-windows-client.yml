name: Build RunTars Windows installer

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-windows.[0-9]+"]
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    environment: windows-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set release version
        shell: bash
        env:
          STABLE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$STABLE_VERSION" && "$GITHUB_REF_NAME" == "v$STABLE_VERSION" ]]; then
            version="$STABLE_VERSION"
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-windows\.[1-9][0-9]*$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm --filter @rakazo/desktop... --filter @rakazo/web... --filter rakazo install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build renderer and desktop app
        shell: bash
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
          RAKAZO_DESKTOP_RELEASE: "1"
          RUNTARS_MANUAL_UPDATES: "1"
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/web build
          pnpm --filter @rakazo/desktop build
          node apps/desktop/scripts/release-feed.mjs apps/desktop/package.json
          cd apps/desktop
          npm pkg set --json build.forceCodeSigning=true
          npm pkg set productName=RunTars author.name=RunTars version="$RELEASE_VERSION" \
            build.appId=com.runtars.desktop build.extraMetadata.name=runtars \
            'build.win.signtoolOptions.signingHashAlgorithms[0]=sha256'
      - name: Sign and timestamp the x64 NSIS installer
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_RELEASE_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_RELEASE_PFX_PASSWORD }}
        run: |
          if (!$env:WIN_CSC_LINK -or !$env:WIN_CSC_KEY_PASSWORD) { throw "Missing Windows release key" }
          pnpm --filter @rakazo/desktop exec electron-builder --win nsis --x64 --publish never
      - name: Verify timestamped Authenticode signatures
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "apps/desktop/out/RunTars-Setup-$env:RELEASE_VERSION.exe").Path
          $app = (Resolve-Path 'apps/desktop/out/win-unpacked/RunTars.exe').Path
          $cert = (Get-AuthenticodeSignature $installer).SignerCertificate
          if ($cert.GetCertHashString('SHA256') -ne 'd2dd9f4b9b6193a04cd4df900c04e1a57e1effe48807cb098abe308610382892') {
            throw 'Unexpected signing certificate'
          }
          # Trust only the pinned public certificate on this ephemeral runner for WinVerifyTrust.
          $publicCert = Join-Path $env:RUNNER_TEMP 'signer.cer'
          [IO.File]::WriteAllBytes($publicCert, $cert.RawData)
          Import-Certificate -FilePath $publicCert -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          foreach ($file in $installer, $app) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid' -or !$sig.TimeStamperCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Invalid signature or timestamp on $file"
            }
          }
      - name: Install, reinstall and launch RunTars
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "apps/desktop/out/RunTars-Setup-$env:RELEASE_VERSION.exe").Path
          $app = (Resolve-Path 'apps/desktop/out/win-unpacked/RunTars.exe').Path
          $dest = Join-Path $env:RUNNER_TEMP 'installed-runtars'
          foreach ($install in 1..2) {
            Write-Host "Starting silent installation $install"
            $result = Start-Process $installer -ArgumentList '/S', "/D=$dest" -PassThru
            if (!$result.WaitForExit(90000)) { throw 'Installer did not exit in 90 seconds' }
            if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)" }
            if ((Get-FileHash "$dest/RunTars.exe").Hash -ne (Get-FileHash $app).Hash) { throw 'Installed binary mismatch' }
          }
          $process = Start-Process "$dest/RunTars.exe" -PassThru
          try {
            if (!$process.WaitForInputIdle(30000) -or $process.HasExited) { throw 'Application failed to start' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: apps/desktop/out/RunTars-Setup-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
